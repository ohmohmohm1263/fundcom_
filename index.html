<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FundCom - Flashcards</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ========== หน้าแรก ========== -->
<div id="home">
  <h1>📚 FundCom Flashcards</h1>
  <p class="small">ทบทวนข้อสอบ Fundamental of Computer Science ด้วยบัตรคำ</p>

  <div class="box" id="homeStats"></div>

  <h2>เลือกหัวข้อเพื่อเริ่มทบทวน</h2>
  <div id="topicList"></div>

  <hr>
  <button onclick="startSession('all')">🎲 ทบทวนทุกหัวข้อ</button>
  <button onclick="startReviewWeak()">🔁 ทบทวนข้อที่ยังไม่แม่น</button>
  <button onclick="resetProgress()">🗑 รีเซ็ตประวัติทั้งหมด</button>
</div>

<!-- ========== หน้าเล่น Flashcard ========== -->
<div id="flashcard" class="hidden">
  <div class="stats" id="cardProgress"></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <!-- ตัวการ์ด -->
  <div class="card-container" onclick="flipCard()">
    <div class="card-inner" id="cardInner">
      
      <!-- ด้านหน้า: คำถาม -->
      <div class="card-front">
        <div class="topic-badge" id="cardTopic"></div>
        <h2 id="questionText"></h2>
        <p class="small text-center mt-20">👆 กดที่การ์ดเพื่อดูเฉลย</p>
      </div>

      <!-- ด้านหลัง: เฉลย -->
      <div class="card-back">
        <div class="topic-badge" id="cardTopicBack"></div>
        <h3 class="text-green">✅ คำตอบ:</h3>
        <p id="answerText" style="font-size: 1.1em; font-weight: bold; margin-bottom: 15px;"></p>
        
        <h3 class="text-blue">💡 คำอธิบาย:</h3>
        <p id="explainText" style="font-size: 0.95em; line-height: 1.5;"></p>
      </div>

    </div>
  </div>

  <hr>
  <!-- ปุ่มควบคุม -->
  <div id="controls" class="hidden">
    <button class="btn-wrong" onclick="markCard(false)">❌ ยังไม่แม่น</button>
    <button class="btn-correct" onclick="markCard(true)">✅ จำได้</button>
  </div>
  <button onclick="goHome()">← กลับหน้าแรก</button>
</div>

<!-- ========== หน้าสรุปผล ========== -->
<div id="result" class="hidden">
  <h1>📊 สรุปผลการทบทวน</h1>
  <div class="box" id="resultText"></div>
  <button onclick="retry()">🔁 ทบทวนชุดนี้อีกครั้ง</button>
  <button onclick="goHome()">← กลับหน้าแรก</button>
</div>

<footer>FundCom Flashcards · ข้อมูลเก็บบนเครื่องคุณ</footer>

<!-- ดึงไฟล์คำถามเดิมมาใช้ -->
<script src="questions.js"></script>
<script>
// ... (ก๊อปปี้โค้ด JavaScript ทั้งหมดที่อยู่ในแท็ก <script> จากข้อความก่อนหน้ามาวางตรงนี้ครับ) ...
</script>
</body>
</html>
