<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FundCom - ทบทวนข้อสอบ</title>
<link rel="stylesheet" href="style.css">
<style>
  /* CSS เพิ่มเติมสำหรับโหมด Choice และ Matching */
  .mode-btns { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .mode-btn { flex: 1; min-width: 120px; padding: 15px 10px; font-size: 16px; font-weight: bold; border-radius: 8px; background: #222; border: 1px solid #555; cursor: pointer; text-align: center; }
  .mode-btn:hover { background: #333; }
  
  /* สำหรับโหมด Choice */
  .choice-btn { display: block; width: 100%; text-align: left; padding: 12px 15px; margin: 8px 0; background: #1a1a1a; border: 1px solid #333; border-radius: 6px; cursor: pointer; color: #e8e8e8; font-size: 15px; transition: 0.2s; }
  .choice-btn:hover:not(:disabled) { background: #262626; }
  .choice-btn.correct { background: #1a3a1a; border-color: #4caf50; color: #b8f0b8; }
  .choice-btn.wrong { background: #3a1a1a; border-color: #e53935; color: #f0b8b8; }
  
  /* สำหรับโหมด Matching */
  .match-container { display: flex; gap: 15px; margin-top: 15px; }
  .match-col { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .match-item { padding: 12px; background: #1a1a1a; border: 1px solid #333; border-radius: 6px; cursor: pointer; text-align: center; transition: 0.2s; font-size: 14px; }
  .match-item:hover:not(.matched) { background: #262626; }
  .match-item.selected { border-color: #2196f3; background: #1a263a; }
  .match-item.matched { opacity: 0.3; pointer-events: none; background: #1a3a1a; border-color: #4caf50; }
</style>
</head>
<body>

<!-- ========== หน้าแรก ========== -->
<div id="home">
    <!-- แถบเลือกธีม -->
  <div style="text-align: right; margin-bottom: 10px;">
    <select id="themeSelector" onchange="changeTheme(this.value)" style="padding: 8px; border-radius: 8px; border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--btn-text); font-family: inherit; font-size: 14px; cursor: pointer;">
      <option value="pastel">🌸 Pastel (สว่าง)</option>
      <option value="dark">🌙 Dark (มืด)</option>
      <option value="ocean">🌊 Ocean (น้ำเงิน)</option>
      <option value="forest">🌿 Forest (เขียว)</option>
    </select>
  </div>
  <h1>📚 FundCom Flashcards</h1>
  <p class="small">ทบทวนข้อสอบ Fundamental of Computer Science</p>

  <div class="box" id="homeStats"></div>

  <h2>เลือกหัวข้อเพื่อเริ่มทบทวน</h2>
  <div id="topicList"></div>

  <hr>
  <button onclick="selectMode('all')">🎲 ทบทวนทุกหัวข้อ (เลือกโหมด)</button>
  <button onclick="startReviewWeak()">🔁 ทบทวนข้อที่ยังไม่แม่น</button>
  <button onclick="resetProgress()">🗑 รีเซ็ตประวัติทั้งหมด</button>
</div>

<!-- ========== หน้าเลือกโหมด ========== -->
<div id="modeSelect" class="hidden">
  <h1 id="modeSelectTitle">เลือกโหมดการเล่น</h1>
  <p class="small" id="modeSelectTopic"></p>
  
  <div class="mode-btns">
    <button class="mode-btn" onclick="playMode('flashcard')">🎴 แฟลชการ์ด<br><span class="small">(จำคำถาม-คำตอบ)</span></button>
    <button class="mode-btn" onclick="playMode('choice')">📝 ปรนัย<br><span class="small">(เลือกคำตอบที่ถูก)</span></button>
    <button class="mode-btn" onclick="playMode('matching')">🧩 จับคู่<br><span class="small">(เล่นทีละ 4 ข้อ)</span></button>
  </div>
  
  <button onclick="goHome()">← กลับหน้าแรก</button>
</div>

<!-- ========== หน้าเล่น Flashcard ========== -->
<div id="flashcard" class="hidden">
  <div class="stats" id="cardProgress"></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div class="card-container" onclick="flipCard()">
    <div class="card-inner" id="cardInner">
      <div class="card-front">
        <div class="topic-badge" id="cardTopic"></div>
        <h2 id="questionText"></h2>
        <p class="small text-center mt-20">👆 กดที่การ์ดเพื่อดูเฉลย</p>
      </div>
      <div class="card-back">
        <div class="topic-badge" id="cardTopicBack"></div>
        <h3 class="text-green">✅ คำตอบ:</h3>
        <p id="answerText" style="font-size: 1.1em; font-weight: bold; margin-bottom: 15px;"></p>
        <h3 class="text-blue">💡 คำอธิบาย:</h3>
        <p id="explainText" style="font-size: 0.95em; line-height: 1.5;"></p>
      </div>
    </div>
  </div>

  <hr>
  <div id="controls" class="hidden">
    <button onclick="prevCard()" style="width: 100%; margin-bottom: 10px; background: #333; color: #fff; border: 1px solid #555; font-weight: bold;">← ข้อก่อนหน้า</button>
    <div style="display: flex; gap: 10px;">
      <button class="btn-wrong" onclick="markCard(false)" style="flex: 1;">❌ ยังไม่แม่น</button>
      <button class="btn-correct" onclick="markCard(true)" style="flex: 1;">✅ จำได้</button>
    </div>
  </div>
  <button onclick="goHome()" style="margin-top: 15px;">← กลับหน้าแรก</button>
</div>

<!-- ========== หน้าเล่น Choice ========== -->
<div id="choiceMode" class="hidden">
  <div class="stats" id="choiceProgress"></div>
  <div class="progress-bar"><div class="progress-fill" id="choiceProgressFill"></div></div>
  <h2 id="choiceQuestionText"></h2>
  <div id="choiceOptions"></div>
  <div id="choiceFeedback" class="hidden"></div>
  <hr>
  <button id="choiceNextBtn" class="hidden" onclick="nextChoiceCard()">ข้อต่อไป →</button>
  <button onclick="goHome()">← กลับหน้าแรก</button>
</div>

<!-- ========== หน้าเล่น Matching ========== -->
<div id="matchingMode" class="hidden">
  <div class="stats" id="matchProgress"></div>
  <h2 style="text-align: center;">🧩 จับคู่คำถามกับคำตอบ</h2>
  <p class="small" style="text-align: center; margin-bottom: 20px;">เลือกคำถามทางซ้าย และเลือกคำตอบที่ถูกต้องทางขวา</p>
  
  <div class="match-container">
    <div class="match-col" id="matchLeft"></div>
    <div class="match-col" id="matchRight"></div>
  </div>
  
  <hr>
  <button id="matchNextBtn" class="hidden" onclick="nextMatchBatch()" style="width: 100%; padding: 15px; font-size: 16px;">ชุดถัดไป →</button>
  <button onclick="goHome()" style="margin-top: 15px;">← กลับหน้าแรก</button>
</div>

<!-- ========== หน้าสรุปผล ========== -->
<div id="result" class="hidden">
  <h1>📊 สรุปผลการทบทวน</h1>
  <div class="box" id="resultText"></div>
  <button onclick="retry()">🔁 ทบทวนชุดนี้อีกครั้ง</button>
  <button onclick="goHome()">← กลับหน้าแรก</button>
</div>

<footer>FundCom · ข้อมูลเก็บบนเครื่องคุณ</footer>

<script src="questions.js"></script>
<script>
// =========================================================
//  State & Storage
// =========================================================
const LS_WEAK = 'fundcom_weak_cards';
let state = {
  currentList: [], index: 0, isFlipped: false, weakCards: [],
  mode: 'flashcard', // 'flashcard', 'choice', 'matching'
  matchBatch: [], matchSelectedLeft: null, matchSelectedRight: null, matchCorrectCount: 0
};

function loadWeak() { try { return JSON.parse(localStorage.getItem(LS_WEAK)) || []; } catch(e) { return []; } }
function saveWeak(w) { localStorage.setItem(LS_WEAK, JSON.stringify(w)); }
function addWeak(i) { const w = loadWeak(); if (!w.includes(i)) { w.push(i); saveWeak(w); } }
function removeWeak(i) { saveWeak(loadWeak().filter(x => x !== i)); }

// =========================================================
//  Home & Mode Selection
// =========================================================
function renderHome() {
  showPage('home');
  const weakCount = loadWeak().length;
  const topics = getAllTopics();
  
  document.getElementById('homeStats').innerHTML = `
    <b>สถานะการทบทวน</b><br>
    📌 ข้อที่ยังไม่แม่น: <b>${weakCount}</b> ข้อ<br>
    📝 บัตรคำทั้งหมด: <b>${QUESTIONS.length}</b> ใบ
  `;

  const topicList = document.getElementById('topicList');
  topicList.innerHTML = '';
  topics.forEach(t => {
    const count = QUESTIONS.filter(q => q.topic === t).length;
    const btn = document.createElement('button');
    btn.className = 'topic-btn';
    btn.innerHTML = `📂 ${t} <span class="small">(${count} ใบ)</span>`;
    btn.onclick = () => selectMode(t);
    topicList.appendChild(btn);
  });
}

function getAllTopics() { const set = new Set(); QUESTIONS.forEach(q => set.add(q.topic)); return Array.from(set); }
function selectMode(topic) {
  state.currentTopic = topic;
  document.getElementById('modeSelectTitle').textContent = "เลือกโหมดการเล่น";
  document.getElementById('modeSelectTopic').textContent = "หัวข้อ: " + topic;
  showPage('modeSelect');
}

function playMode(mode) {
  state.mode = mode;
  let list;
  if (state.currentTopic === 'all') list = QUESTIONS.map((_, i) => i);
  else list = QUESTIONS.map((q, i) => q.topic === state.currentTopic ? i : -1).filter(i => i >= 0);
  
  if (mode === 'matching') {
    if (list.length < 4) { alert('โหมดจับคู่ต้องมีอย่างน้อย 4 ข้อครับ'); return; }
    startMatching(shuffle(list));
  } else {
    startWithList(shuffle(list));
  }
}

function showPage(pageId) {
  ['home', 'modeSelect', 'flashcard', 'choiceMode', 'matchingMode', 'result'].forEach(id => {
    document.getElementById(id).classList.add('hidden');
  });
  document.getElementById(pageId).classList.remove('hidden');
}

// =========================================================
//  Utilities & Starters
// =========================================================
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function startReviewWeak() {
  const weak = loadWeak();
  if (weak.length === 0) { alert('ยินดีด้วย! คุณจำได้ครบทุกข้อแล้ว 🎉'); return; }
  state.currentTopic = 'ข้อที่ยังไม่แม่น';
  selectMode('weak');
}

function startSession(topic, mode) {
  state.currentTopic = topic;
  playMode(mode);
}

function startWithList(list) {
  state.currentList = list; state.index = 0; state.weakCards = []; state.isFlipped = false;
  if (state.mode === 'flashcard') { showPage('flashcard'); renderCard(); }
  else if (state.mode === 'choice') { showPage('choiceMode'); renderChoice(); }
}

function retry() {
  if (state.mode === 'matching') startMatching(shuffle(state.currentList));
  else startWithList(shuffle(state.currentList));
}

// =========================================================
//  Mode 1: Flashcard
// =========================================================
function renderCard() {
  if (state.index >= state.currentList.length) { showResult(); return; }
  const q = QUESTIONS[state.currentList[state.index]];
  state.isFlipped = false;
  document.getElementById('cardInner').classList.remove('is-flipped');
  document.getElementById('controls').classList.add('hidden');

  document.getElementById('cardProgress').textContent = `ใบที่ ${state.index + 1} / ${state.currentList.length}`;
  document.getElementById('progressFill').style.width = `${(state.index / state.currentList.length) * 100}%`;
  document.getElementById('cardTopic').textContent = q.topic;
  document.getElementById('cardTopicBack').textContent = q.topic;
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('answerText').textContent = q.choices[q.answer];
  document.getElementById('explainText').textContent = q.explain;
}

function flipCard() {
  state.isFlipped = !state.isFlipped;
  const cardInner = document.getElementById('cardInner');
  if (state.isFlipped) {
    cardInner.classList.add('is-flipped');
    setTimeout(() => { document.getElementById('controls').classList.remove('hidden'); }, 300);
  } else { cardInner.classList.remove('is-flipped'); }
}

function markCard(isRemembered) {
  const qIndex = state.currentList[state.index];
  if (isRemembered) removeWeak(qIndex); else { addWeak(qIndex); state.weakCards.push(qIndex); }
  state.index++; renderCard();
}

function prevCard() {
  if (state.index > 0) { state.index--; renderCard(); } 
  else { alert('นี่คือข้อแรกสุดแล้วครับ'); }
}

// =========================================================
//  Mode 2: Multiple Choice
// =========================================================
function renderChoice() {
  if (state.index >= state.currentList.length) { showResult(); return; }
  const q = QUESTIONS[state.currentList[state.index]];
  state.isFlipped = false; // used as answered flag
  state.selectedAnswer = null;

  document.getElementById('choiceProgress').textContent = `ข้อที่ ${state.index + 1} / ${state.currentList.length} · ${q.topic}`;
  document.getElementById('choiceProgressFill').style.width = `${(state.index / state.currentList.length) * 100}%`;
  document.getElementById('choiceQuestionText').textContent = q.q;
  document.getElementById('choiceFeedback').classList.add('hidden');
  document.getElementById('choiceNextBtn').classList.add('hidden');

  const optDiv = document.getElementById('choiceOptions');
  optDiv.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = `${i + 1}. ${c}`;
    btn.onclick = () => answerChoice(i, btn);
    optDiv.appendChild(btn);
  });
}

function answerChoice(selected, btn) {
  if (state.isFlipped) return; // ถ้าตอบแล้วไม่ต้องทำอะไร
  state.isFlipped = true;
  const q = QUESTIONS[state.currentList[state.index]];
  const isCorrect = selected === q.answer;
  
  const btns = document.querySelectorAll('#choiceOptions .choice-btn');
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === q.answer) b.classList.add('correct');
    if (i === selected && !isCorrect) b.classList.add('wrong');
  });

  if (isCorrect) { removeWeak(state.currentList[state.index]); } 
  else { addWeak(state.currentList[state.index]); state.weakCards.push(state.currentList[state.index]); }

  const fb = document.getElementById('choiceFeedback');
  fb.classList.remove('hidden');
  fb.innerHTML = `
    <div class="box"><b>${isCorrect ? '✅ ถูกต้อง' : '❌ ผิด'}</b></div>
    <div class="explanation"><b>คำอธิบาย:</b> ${q.explain}</div>
  `;
  document.getElementById('choiceNextBtn').classList.remove('hidden');
}

function nextChoiceCard() { state.index++; renderChoice(); }

// =========================================================
//  Mode 3: Matching (จับคู่ทีละ 4 ข้อ)
// =========================================================
function startMatching(list) {
  state.currentList = list; 
  state.index = 0; 
  state.matchCorrectCount = 0;
  showPage('matchingMode');
  loadMatchBatch();
}

function loadMatchBatch() {
  if (state.index >= state.currentList.length) { showResult(); return; }
  
  // ดึงมา 4 ข้อ (หรือเท่าที่เหลือ)
  state.matchBatch = state.currentList.slice(state.index, state.index + 4);
  state.matchSelectedLeft = null; 
  state.matchSelectedRight = null;
  state.matchCorrectCount = 0;
  
  document.getElementById('matchProgress').textContent = `ชุดที่ ${Math.floor(state.index/4) + 1} (เหลืออีก ${state.currentList.length - state.index} ข้อ)`;
  document.getElementById('matchNextBtn').classList.add('hidden');

  const leftCol = document.getElementById('matchLeft');
  const rightCol = document.getElementById('matchRight');
  leftCol.innerHTML = ''; rightCol.innerHTML = '';

  // สร้างฝั่งซ้าย (คำถาม)
  state.matchBatch.forEach((qIndex, i) => {
    const div = document.createElement('div');
    div.className = 'match-item';
    div.textContent = QUESTIONS[qIndex].q;
    div.dataset.qIndex = qIndex;
    div.onclick = () => selectMatchItem('left', div);
    leftCol.appendChild(div);
  });

  // สร้างฝั่งขวา (คำตอบ) แบบสลับที่
  const shuffledBatch = shuffle(state.matchBatch);
  shuffledBatch.forEach((qIndex, i) => {
    const div = document.createElement('div');
    div.className = 'match-item';
    div.textContent = QUESTIONS[qIndex].choices[QUESTIONS[qIndex].answer];
    div.dataset.qIndex = qIndex;
    div.onclick = () => selectMatchItem('right', div);
    rightCol.appendChild(div);
  });
}

function selectMatchItem(side, el) {
  if (el.classList.contains('matched')) return;

  // ยกเลิกการเลือกอันเก่าในฝั่งเดียวกัน
  const parent = side === 'left' ? document.getElementById('matchLeft') : document.getElementById('matchRight');
  parent.querySelectorAll('.match-item').forEach(item => item.classList.remove('selected'));
  el.classList.add('selected');

  if (side === 'left') state.matchSelectedLeft = el;
  else state.matchSelectedRight = el;

  // ถ้าเลือกครบทั้งสองฝั่ง ให้ตรวจคำตอบ
  if (state.matchSelectedLeft && state.matchSelectedRight) {
    checkMatch();
  }
}

function checkMatch() {
  const left = state.matchSelectedLeft;
  const right = state.matchSelectedRight;
  const isMatch = left.dataset.qIndex === right.dataset.qIndex;

  if (isMatch) {
    left.classList.add('matched'); right.classList.add('matched');
    left.classList.remove('selected'); right.classList.remove('selected');
    state.matchCorrectCount++;
    
    // เช็กว่าจับคู่ครบ 4 ข้อในชุดนี้หรือยัง
    if (state.matchCorrectCount === state.matchBatch.length) {
      document.getElementById('matchNextBtn').classList.remove('hidden');
      document.getElementById('matchNextBtn').textContent = (state.index + 4 >= state.currentList.length) ? 'ดูผลลัพธ์ 🎉' : 'ชุดถัดไป →';
    }
  } else {
    // ถ้าผิด ให้กระพริบแดงแล้วยกเลิกการเลือก
    left.style.borderColor = 'red'; right.style.borderColor = 'red';
    setTimeout(() => {
      left.style.borderColor = ''; right.style.borderColor = '';
      left.classList.remove('selected'); right.classList.remove('selected');
    }, 500);
  }
  
  state.matchSelectedLeft = null;
  state.matchSelectedRight = null;
}

function nextMatchBatch() {
  state.index += 4;
  loadMatchBatch();
}

// =========================================================
//  Results & Global Actions
// =========================================================
function showResult() {
  showPage('result');
  let text = '';
  
  if (state.mode === 'matching') {
    text = `จับคู่ทั้งหมด <b>${state.currentList.length}</b> ข้อ<br>`;
  } else {
    const total = state.currentList.length;
    const missed = state.weakCards.length;
    const correct = total - missed;
    const pct = Math.round((correct / total) * 100);
    let comment = pct >= 80 ? '🎉 สุดยอด! คุณแม่นมาก' : pct >= 50 ? '👍 ดีแล้ว ทบทวนอีกนิดนะ' : '📚 ยังต้องฝึกฝนอีกหน่อย สู้ๆ!';
    text = `
      ทบทวนทั้งหมด <b>${total}</b> ข้อ<br>
      จำได้/ตอบถูก <b>${correct}</b> ข้อ (${pct}%)<br>
      ยังไม่แม่น/ตอบผิด <b>${missed}</b> ข้อ<br><br>
      ${comment}
    `;
  }
  
  document.getElementById('resultText').innerHTML = text;
}

function goHome() { renderHome(); }

function resetProgress() {
  if (!confirm('ลบประวัติข้อที่ยังไม่แม่นทั้งหมด?')) return;
  localStorage.removeItem(LS_WEAK);
  renderHome();
}
// =========================================================
//  Theme Logic
// =========================================================
function changeTheme(themeName) {
  document.documentElement.setAttribute('data-theme', themeName);
  localStorage.setItem('fundcom_theme', themeName);
}

// โหลดธีมที่เคยเลือกไว้ตอนเปิดเว็บ
function loadTheme() {
  const savedTheme = localStorage.getItem('fundcom_theme') || 'pastel';
  document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('themeSelector').value = savedTheme;
}

// เรียกใช้ฟังก์ชันโหลดธีมทันที
loadTheme();
  
// =========================================================
renderHome();
</script>
</body>
</html>
